<main id="main" class="login-shell"><div class="login-card panel"><p class="eyebrow">Welcome back</p><h1>Sign in to Inbox Tend</h1><p class="login-intro">Use your workspace account to review messages and tasks.</p><form id="login-form"><label for="username">Email</label><input id="username" name="username" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="login-status" role="alert" aria-live="polite"></p><button type="submit" class="action"><i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>Sign in</button></form><p class="login-footnote"><i class="fa-solid fa-lock mr-1" aria-hidden="true"></i>Your Gmail inbox is shown read-only after you connect it. No message is sent from this app.</p></div></main>
