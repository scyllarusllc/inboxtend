name: Local demo checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python unit and local HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q app.py tasks.py tests
  styles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build tooling
        run: npm ci
      - name: Rebuild the stylesheet and Font Awesome files
        run: |
          npm run build:css
          npm run vendor:fa
      - name: Committed CSS and vendored files must match their sources
        run: git diff --exit-code static/styles.css static/vendor
