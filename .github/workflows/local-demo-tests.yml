name: Local demo checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python unit and local HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python source
        run: python -m compileall -q app.py tasks.py tests
